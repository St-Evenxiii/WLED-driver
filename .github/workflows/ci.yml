name: CI

on:
  push:
  pull_request:

jobs:
  firmware-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make -C firmware/tests

  firmware-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: FastLED
          sketch-paths: |
            - firmware/test_matrix

  pcb-drc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 7
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            kicad kicad-footprints
      - name: DRC + netlist parity
        run: /usr/bin/python3 pcb/check_board.py --report drc.rpt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drc-report
          path: drc.rpt
